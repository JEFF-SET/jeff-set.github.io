<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="108 108 292 292" role="img" aria-label="Jefferson Blog">
  <style>
    .part{opacity:0;animation:drop .6s cubic-bezier(.2,.8,.2,1) forwards}
    .left{animation-delay:.1s}
    .right{animation-delay:.3s}
    .top{animation-delay:.5s}
    .solar{animation:drop .6s .8s cubic-bezier(.2,.8,.2,1) forwards,pulse 3s 1.6s ease-in-out infinite}
    @keyframes drop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
    @media (prefers-reduced-motion:reduce){.part,.solar{animation:none;opacity:1}}
  </style>
  <g stroke="#111" stroke-width="8" stroke-linejoin="round">
    <polygon class="part left" points="135,186 256,256 256,396 135,326" fill="#111"/>
    <polygon class="part right" points="256,256 377,186 377,326 256,396" fill="#4a4a4a"/>
    <polygon class="part top" points="256,116 377,186 256,256 135,186" fill="#f4f1ea"/>
  </g>
  <polygon class="part solar" points="135,186 195.5,151 256,186 195.5,221" fill="#e8590c" stroke="#111" stroke-width="8" stroke-linejoin="round"/>
  <g class="part solar" stroke="#111" stroke-width="4" stroke-linecap="round">
    <line x1="195.5" y1="151" x2="316.5" y2="221"/>
    <line x1="316.5" y1="151" x2="195.5" y2="221"/>
  </g>
</svg>
