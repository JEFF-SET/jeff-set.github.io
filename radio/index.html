<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Radio: Audio + Video Hybrid</title>
    <!-- ВИПРАВЛЕНО: Правильне посилання на повний скрипт Telegram Web App -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            background: #000; 
            color: #b0b0b0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .player-container {
            background: #000;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 20px 0px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border: 5px solid rgba(255, 255, 255, 0.18);
            width: auto;
        }

        h3 { margin: 0 0 5px 0; font-size: 18px; }
        p { font-size: 14px; color: #b0b0b0; margin-bottom: 20px; }

        /* Стиль для відкритого відео (живої обкладинки) */
        .live-cover {
            width: 100%;
            border-radius: 0px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .play-btn {
            background: #b0b0b0;
            color: #000;
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }
        .play-btn:active { transform: scale(0.5); background: #000; }
        
        /* НОВЕ: Стиль для SVG-іконки всередині вашої круглої кнопки */
        .play-btn svg {
            width: 40px;
            height: 40px;
            fill: #000; /* Іконка буде чорною на сірому фоні кнопки */
            display: block;
        }

        #log { margin-top: 15px; font-size: 11px; color: #b0b0b0; }
    </style>
</head>
<body>

    <div class="player-container">
        <h3> ⲢⲀⲆⲒⲞ 📻 ⳖⲈϜϜⲈRⲊⲞⲚ</h3>
        <p id="status">Натисніть Play для старту</p>

        <!-- ВІДАРТИЙ ВІДЕОТЕГ: Тільки картинка. -->
        <video id="radio-video" src="https://jeff-set.github.io/radio/videoplayback2.mp4" loop preload="auto" playsinline muted class="live-cover"></video>

        <!-- ПРИХОВАНИЙ АУДІОТЕГ: Тільки фоновий звук для Telegram -->
        <audio id="radio-audio" src="https://jeff-set.github.io/radio/radio2.mp3" loop preload="auto"></audio>
        
        <br>
        <!-- ЗМІНЕНО: Текст ▶ замінено на чітку геометричну SVG-іконку -->
        <button class="play-btn" id="ctrl-btn" onclick="togglePlayback()">
            <svg viewBox="0 0 24 24">
                <path d="M8 5v14l11-7z"></path>
            </svg>
        </button>
        <div id="log">Статус: Очікування дії</div>
    </div>

    <script>
        // ... Логіка ініціалізації Telegram залишається без змін ...
        let tg = null;
        try {
            if (window.Telegram && window.Telegram.WebApp) {
                tg = window.Telegram.WebApp;
                tg.ready();
                tg.expand();
            }
        } catch(e) { console.log("Відкрито в звичайному браузері"); }

        const video = document.getElementById('radio-video');
        const audio = document.getElementById('radio-audio');
        const btn = document.getElementById('ctrl-btn');
        const statusText = document.getElementById('status');
        const log = document.getElementById('log');

        // ЗМІНЕНО: Функція тепер плавно перемикає вектори всередині SVG
        function togglePlayback() {
            const svgPath = document.querySelector('#ctrl-btn svg path');

            if (audio.paused) {
                log.textContent = 'Синхронізація потоків...';
                
                Promise.all([audio.play(), video.play()])
                    .then(() => {
                        // Міняємо шлях на дві чіткі смужки пауз
                        svgPath.setAttribute('d', 'M6 19h4V5H6v14zm8-14v14h4V5h-4z');
                        statusText.textContent = 'Зараз грає (Гібрид)';
                        log.textContent = 'Музика та відео успішно запущені!';
                    })
                    .catch((error) => {
                        log.textContent = 'Помилка запуска: ' + error.message;
                        console.error(error);
                    });
            } else {
                audio.pause();
                video.pause();
                
                // Повертаємо вектор трикутника Play
                svgPath.setAttribute('d', 'M8 5v14l11-7z');
                statusText.textContent = 'Пауза';
                log.textContent = 'Потік зупинено';
            }
        }
    </script>

</body>
</html>
