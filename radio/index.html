<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>JEFF-SET: Radio Station 📻</title>
    <link rel="stylesheet" href="css/jeff-set.css">
    <link rel="stylesheet" href="css/logo-anim.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
    <!-- Підключаємо Telegram Web App скрипт -->
    <script src="https://telegram.org"></script>
    <script src="js/logo-anim.js"></script>
    <style>
        /* Додаткові стилі для інтеграції радіо у ваш шаблон */
        .radio-section {
            text-align: center;
            padding: 40px 20px;
            margin: 20px auto;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
        }

        /* Велика кругла кнопка Play/Pause у вашому фірмовому стилі */
        .radio-btn {
            background: #2481cc; /* Можна замінити на колір вашого бренду */
            color: white;
            border: none;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            font-size: 32px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            margin: 20px 0;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(36, 129, 204, 0.4);
        }

        .radio-btn:active {
            transform: scale(0.9);
            background: #1c6aa8;
        }

        .radio-status {
            font-size: 16px;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .radio-log {
            font-size: 12px;
            opacity: 0.6;
        }
    </style>
</head>

<body>
    <div class="topbar">
        <a href="/" class="logo-mini">
            <svg class="logo-svg-mini" width="40" height="40" viewBox="0 0 140 140">
                <path class="logo-border" d="
                M5,5
                H135
                V105
                A30,30 0 0 1 105,135
                H5
                Z
              " />
                <text x="70" y="105" text-anchor="middle" font-size="90" font-family="'Rubik'" font-weight="700"
                    class="logo-j">J</text>
            </svg>
        </a>
        <form class="theme-toggle" autocomplete="off">
            <input type="checkbox" id="toggle-dark" aria-label="Toggle dark mode">
            <label for="toggle-dark" class="theme-toggle-label"></label>
        </form>
    </div>

    <div class="logo-animated-wrap">
        <!-- Квадрат с J -->
        <div class="logo-single">
            <svg class="logo-svg" width="140" height="140" viewBox="0 0 140 140">
                <path class="logo-border" d="
                M5,5
                H135
                V105
                A30,30 0 0 1 105,135
                H5
                Z
          " />
                <text x="70" y="105" text-anchor="middle" font-size="90" font-family="'Rubik" font-weight="600"
                    class="logo-j">J</text>
            </svg>
        </div>
        <!-- Прямоугольник с JEFF-SET -->
        <div class="logo-full">
            <svg width="540" height="140" viewBox="0 0 540 140">
                <rect x="5" y="5" width="530" height="130" rx="0" class="logo-border" />
                <text x="270" y="105" text-anchor="middle" font-size="90" font-family="'Rubik" font-weight="700"
                    class="logo-word">Jeff-Set</text>
            </svg>
        </div>
    </div> 

    <!-- Головна секція тепер містить лише плеєр радіо -->
    <main>         
        <div class="radio-section">
            <h1 style="margin-top: 0;">ONLINE RADIO</h1>
            <div class="radio-status" id="status">Натисніть Play для старту ефіру</div>
            
            <!-- Ваш аудіотег із прямою адресою пісні -->
            <audio id="radio-audio" src="https://github.io" loop preload="auto"></audio>
            
            <button class="radio-btn" id="ctrl-btn" onclick="togglePlayback()">▶</button>
            <div class="radio-log" id="log">Статус: Очікування</div>
        </div>

        <blockquote class="quote" style="margin-top: 30px;">
            Design is not just what it looks like and feels like. Design is how it works.
        </blockquote>
    </main>

    <div class="footer-meta">
        <span class="location-flag">
            <span class="flag-label">Kyiv</span>
            <svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path fill="#005BBB" d="M32 5H4a4 4 0 0 0-4 4v9h36V9a4 4 0 0 0-4-4z" />
                <path fill="#FFD500" d="M36 27a4 4 0 0 1-4 4H4a4 4 0 0 1-4-4v-9h36v9z" />
            </svg>
            <span class="flag-label">Ukraine</span>
        </span>
    </div>

    <footer>
        &copy; 2026 Jeff-Set &amp; Vitalii K. All rights reserved.
    </footer>

    <script src="js/jeff-set.js"></script>

    <!-- Скрипт логіки плеєра та розгортання в Telegram -->
    <script>
        let tg = null;
        try {
            if (window.Telegram && window.Telegram.WebApp) {
                tg = window.Telegram.WebApp;
                tg.ready();
                tg.expand(); // Розгортаємо плеєр на всю шторку Telegram
            }
        } catch(e) { console.log("Відкрито поза межами Telegram"); }

        const audio = document.getElementById('radio-audio');
        const btn = document.getElementById('ctrl-btn');
        const statusText = document.getElementById('status');
        const log = document.getElementById('log');

        function togglePlayback() {
            if (audio.paused) {
                log.textContent = 'З'єднання з сервером...';
                audio.play()
                    .then(() => {
                        btn.textContent = '⏸';
                        statusText.textContent = 'Зараз в ефірі 📻';
                        log.textContent = 'Успішне підключення';
                    })
                    .catch((error) => {
                        log.textContent = 'Помилка: ' + error.message;
                    });
            } else {
                audio.pause();
                btn.textContent = '▶';
                statusText.textContent = 'Ефір зупинено';
                log.textContent = 'Пауза';
            }
        }
    </script>
</body>
