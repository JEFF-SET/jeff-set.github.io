<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Radio Test</title>
    <!-- Підключаємо Telegram Web App скрипт -->
    <script src="https://telegram.org"></script>
    <style>
        /* Робимо фон напівпрозорим сірим, щоб бачити інтерфейс Telegram позаду */
        body {
            background: rgba(30, 30, 30, 0.6); 
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Картка плеєра з ефектом матового скла */
        .player-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.18);
            width: 250px;
        }

        h3 {
            margin-top: 0;
            margin-bottom: 5px;
            font-size: 18px;
        }

        p {
            font-size: 14px;
            color: #b0b0b0;
            margin-bottom: 25px;
        }

        /* Стильна кнопка Play/Pause */
        .play-btn {
            background: #2481cc;
            color: white;
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }

        .play-btn:active {
            transform: scale(0.9);
            background: #1c6aa8;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <h3>Тест Радіо 📻</h3>
        <p id="status">Натисніть Play для старту</p>

        <!-- Аудіотег. Атрибут 'loop' автоматично ставить пісню на репіт -->
        <audio id="radio-audio" src="/radio/radio.mp3" loop></audio>
        
        <button class="play-btn" id="ctrl-btn" onclick="togglePlayback()">▶</button>
    </div>

    <script>
        // Ініціалізація Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Розгортаємо додаток на весь екран Telegram

        const audio = document.getElementById('radio-audio');
        const btn = document.getElementById('ctrl-btn');
        const statusText = document.getElementById('status');

        function togglePlayback() {
            if (audio.paused) {
                audio.play();
                btn.textContent = '⏸'; // Змінюємо іконку на паузу
                statusText.textContent = 'Зараз грає (Повтор увімкнено)';
            } else {
                audio.pause();
                btn.textContent = '▶'; // Змінюємо іконку на грати
                statusText.textContent = 'Пауза';
            }
        }
    </script>

</body>
</html>
