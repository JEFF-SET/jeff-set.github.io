<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Браузерний Тест Плеєра</title>
    <style>
        body {
            background: #1e1e1e;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            background: #2a2a2a;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        button {
            background: #2481cc;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 15px;
        }
        #log {
            margin-top: 15px;
            font-size: 12px;
            color: #ff6b6b;
        }
    </style>
</head>
<body>

<div class="box">
    <h3>Тест аудіо в браузері 🎵</h3>
    
    <!-- Тимчасово тестуємо ВІДНОСНИЙ шлях без першого слеша -->
    <audio id="track" src="radio/radio.mp3" loop preload="auto"></audio>
    
    <button onclick="playAudio()">КЛІКНИ МЕНЕ ЩОБ ЗАГРАТИ</button>
    <div id="log">Статус: Очікування кліку...</div>
</div>

<script>
    function playAudio() {
        const audio = document.getElementById('track');
        const log = document.getElementById('log');
        
        log.style.color = '#76ff03';
        log.textContent = 'Спроба відтворення...';

        audio.play()
            .then(() => {
                log.textContent = 'Успіх! Музика має грати (на репіті).';
            })
            .catch((error) => {
                log.style.color = '#ff6b6b';
                log.textContent = 'Помилка браузера: ' + error.message;
                console.error(error);
            });
    }
</script>

</body>
</html>
