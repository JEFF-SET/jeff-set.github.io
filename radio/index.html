<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Radio: True Endless Non-Stop</title>
    <!-- ВИПРАВЛЕНО: Правильне посилання -->
    <script src="https://telegram.org"></script>
    <style>
        body { background: #000; color: #b0b0b0; font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .player-container { background: #000; padding: 25px 0px; border-radius: 20px; text-align: center; border: 5px solid rgba(255, 255, 255, 0.18); width: 90%; max-width: 400px; }
        .live-cover { width: 100%; max-width: 85%; border-radius: 12px; margin-bottom: 20px; display: block; margin-left: auto; margin-right: auto; }
        .play-btn { background: #b0b0b0; color: #000; border: none; width: 65px; height: 65px; border-radius: 50%; cursor: pointer; display: inline-flex; justify-content: center; align-items: center; margin-top: 10px; }
        .play-btn svg { width: 34px; height: 34px; fill: #000; }
        #log { margin-top: 15px; font-size: 11px; color: #b0b0b0; padding: 0 10px; }
    </style>
</head>
<body>
    <div class="player-container">
        <h3>ⲢⲀⲆⲒⲞ ⳖⲈϜϜⲈRⲊⲞⲚ</h3>
        <p id="status">Натисніть Play для старту</p>
        <div style="margin: 15px 0; padding: 0 10px;">
            <div id="track-artist" style="font-size: 16px; font-weight: bold; color: #fff; margin-bottom: 4px;">Завантаження...</div>
            <div id="track-title" style="font-size: 14px; color: #b0b0b0;">...</div>
        </div>
        <img id="track-cover" src="" alt="Cover" class="live-cover">
        <audio id="radio-audio" preload="auto"></audio>
        <button class="play-btn" id="ctrl-btn" onclick="togglePlayback()">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>
        </button>
        <div id="log">Статус: Очікування дії</div>
    </div>
    <script>
        let tg = null;
        try { if (window.Telegram && window.Telegram.WebApp) { tg = window.Telegram.WebApp; tg.ready(); tg.expand(); } } catch (e) { console.log("Відкрито поза Telegram"); }
        const audio = document.getElementById('radio-audio');
        const statusText = document.getElementById('status');
        const log = document.getElementById('log');
        let playlist = [];
        let currentTrackIndex = 0;
        async function loadPlaylist() {
            try {
                log.textContent = 'Отримання ефірного списку...';
                const response = await fetch('https://jeff-set.github.io/radio/playlist.json');
                playlist = await response.json();
                if (playlist.length > 0) {
                    currentTrackIndex = Math.floor(Math.random() * playlist.length);
                    setupTrack(currentTrackIndex, true);
                }
            } catch (error) { log.textContent = "Не вдалося завантажити ефір"; }
        }
        function setupTrack(index, isFirstInit = false) {
            if (playlist.length === 0) return;
            const track = playlist[index];
            document.getElementById('track-artist').textContent = track.artist;
            document.getElementById('track-title').textContent = track.title + ` (${track.year})`;
            document.getElementById('track-cover').src = track.image_url;
            audio.src = track.audio_url;
            audio.load();
            log.textContent = 'В ефірі новий трек';
            if (!isFirstInit) { setTimeout(() => playRadio(), 300); }
        }
        function togglePlayback() {
            if (audio.paused) {
                log.textContent = 'З\'єднання з супутником...';
                playRadio();
            } else { audio.pause(); statusText.textContent = 'Радіо на паузі'; }
        }
        function playRadio() {
            audio.play().then(() => { statusText.textContent = 'ЗАРАЗ В ЕФІРІ 📻'; log.textContent = 'Радіо Jefferson транслює!'; }).catch((error) => { log.textContent = 'Помилка: ' + error.message; });
        }
        audio.addEventListener('ended', () => { log.textContent = 'Перехід...'; playNextRandom(); });
        function playNextRandom() {
            if (playlist.length <= 1) { setupTrack(currentTrackIndex, false); return; }
            let newIndex;
            do { newIndex = Math.floor(Math.random() * playlist.length); } while (newIndex === currentTrackIndex);
            currentTrackIndex = newIndex;
            setupTrack(currentTrackIndex, false);
        }
        loadPlaylist();
    </script>
</body>
</html>
