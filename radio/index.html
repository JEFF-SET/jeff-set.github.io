<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ⲢⲀⲆⲒⲞ ⳖⲈϜϜⲈRⲊⲞⲚ</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            background-color: #b0b0b0;
            /* НОВЕ: Налаштування для фонової картинки */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            /* Трюк для затемнення на 50%: накладаємо чорний градієнт поверх картинки */
            background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5));
            background-blend-mode: overlay;
            /* Змішує чорний колір із картинкою */

            color: #b0b0b0;
            font-family: -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: background-image 0.5s ease;
            /* Плавна зміна фону при перемиканні */
        }


        .player-container {
            background: #000;
            padding: 25px 0px;
            border-radius: 20px;
            text-align: center;
            width: 85%;
            max-width: 500px;
        }

        .live-cover {
            width: 100%;
            max-width: 100%;
            margin-bottom: 20px 0px;
            display: block;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .play-btn {
            background: #b0b0b0;
            color: #000;
            border: none;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            cursor: pointer;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin-top: 10px;
            transition: transform 0.2s, background 0.2s;
        }

        .play-btn:active {
            transform: scale(0.9);
            background: #8e8e8e;
        }

        .play-btn svg {
            width: 45px;
            height: 45px;
            fill: #000;
            display: block;
        }

        #log {
            margin-top: 15px;
            font-size: 11px;
            color: #b0b0b0;
            padding: 0 10px;
        }
    </style>
</head>

<body>
    <div class="player-container">
        <h2>ⲢⲀⲆⲒⲞ ⳖⲈϜϜⲈRⲊⲞⲚ</h2>
        <p id="status">Натисніть Play для старту</p>
        <div style="margin: 15px 0; padding: 0 10px;">
            <div id="track-artist" style="font-size: 16px; font-weight: bold; color: #fff; margin-bottom: 4px;">
                Завантаження...</div>
            <div id="track-title" style="font-size: 14px; color: #b0b0b0;">...</div>
        </div>
        <img id="track-cover" src="" alt="Cover" class="live-cover">
        <audio id="radio-audio" preload="auto"></audio>
        <button class="play-btn" id="ctrl-btn" onclick="togglePlayback()">
            <svg viewBox="0 0 24 24">
                <path d="M8 5v14l11-7z"></path>
            </svg>
        </button>
        <div id="log">Статус: Очікування дії</div>
    </div>

    <script>
        let tg = null;
        try { if (window.Telegram && window.Telegram.WebApp) { tg = window.Telegram.WebApp; tg.ready(); tg.expand(); } } catch (e) { console.log("Відкрито поза Telegram"); }

        const audio = document.getElementById('radio-audio');
        const statusText = document.getElementById('status');
        const log = document.getElementById('log');
        let playlist = [];
        let currentTrackIndex = 0;

        async function loadPlaylist() {
            try {
                log.textContent = 'Отримання ефірного списку...';
                const response = await fetch('https://jeff-set.github.io/radio/playlist.json');
                playlist = await response.json();
                if (playlist.length > 0) {
                    currentTrackIndex = Math.floor(Math.random() * playlist.length);
                    setupTrack(currentTrackIndex, true);
                }
            } catch (error) { log.textContent = "Не вдалося завантажити ефір"; }
        }

        function setupTrack(index, isFirstInit = false) {
            if (playlist.length === 0) return;
            const track = playlist[index];

            document.getElementById('track-artist').textContent = track.artist;
            document.getElementById('track-title').textContent = track.title + ` (${track.year})`;
            document.getElementById('track-cover').src = track.image_url;

            // НОВЕ: Плавна зміна фону всього вікна на обкладинку із затемненням 50%
            document.body.style.backgroundImage = `linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('${track.image_url}')`;

            audio.src = track.audio_url;
            audio.load();
            log.textContent = 'Етерна хвиля налаштована';

            // Якщо це автоперемикання під час гри — запускаємо ПРЯМО ЗАРАЗ без таймаутів
            if (!isFirstInit) {
                playRadio();
            }
        }

        function togglePlayback() {
            const svgPath = document.querySelector('#ctrl-btn svg path');
            if (audio.paused) {
                log.textContent = 'З\'єднання з супутником...';
                playRadio();
            } else {
                audio.pause();
                // ВИПРАВЛЕНО: Повертаємо іконку Play (трикутник)
                svgPath.setAttribute('d', 'M8 5v14l11-7z');
                statusText.textContent = 'Радіо на паузі';
                log.textContent = 'Етер зупинено';
            }
        }

        function playRadio() {
            const svgPath = document.querySelector('#ctrl-btn svg path');
            audio.play()
                .then(() => {
                    // ВИПРАВЛЕНО: Ставимо стильні дві смужки Паузи
                    svgPath.setAttribute('d', 'M6 19h4V5H6v14zm8-14v14h4V5h-4z');
                    statusText.textContent = 'ЗАРАЗ В ЕТЕРІ';
                    log.textContent = 'Радіо Jefferson транслює!';
                })
                .catch((error) => {
                    log.textContent = 'Помилка фону: ' + error.message;
                });
        }

        // АВТОПЕРЕХІД ПРИ ЗАКІНЧЕННІ ТРЕКУ (Повністю синхронний для фону)
        audio.addEventListener('ended', () => {
            log.textContent = 'Зміна хвилі...';
            playNextRandom();
        });

        function playNextRandom() {
            if (playlist.length <= 1) {
                // Якщо трек один — просто скидаємо час в 0 і граємо заново
                audio.currentTime = 0;
                playRadio();
                return;
            }

            let newIndex;
            do {
                newIndex = Math.floor(Math.random() * playlist.length);
            } while (newIndex === currentTrackIndex);

            currentTrackIndex = newIndex;
            setupTrack(currentTrackIndex, false);
        }

        loadPlaylist();
    </script>

</body>

</html>
