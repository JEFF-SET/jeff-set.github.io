<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Radio Test</title>
    <!-- ВИПРАВЛЕНО: Правильне посилання на JS-скрипт Telegram -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            background: rgba(30, 30, 30, 0.6);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .player-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.18);
            width: 250px;
        }

        h3 {
            margin: 0 0 5px 0;
            font-size: 18px;
        }

        p {
            font-size: 14px;
            color: #b0b0b0;
            margin-bottom: 25px;
        }

        .play-btn {
            background: #2481cc;
            color: white;
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }

        .play-btn:active {
            transform: scale(0.9);
            background: #1c6aa8;
        }

        #log {
            margin-top: 15px;
            font-size: 11px;
            color: #b0b0b0;
        }
    </style>
</head>

<body>

    <div class="player-container">
        <h3>Тест Радіо 📻</h3>
        <p id="status">Натисніть Play для старту</p>

        <!-- ЗМІНЕНО НА VIDEO: playsinline не дає мобільним системам відкривати його на весь екран, 
             style="display:none;" повністю ховає саме відеовікно, залишаючи лише звук -->
        <video id="radio-video" src="https://jeff-set.github.io/radio/videoplayback1.mp4" loop preload="auto"
            playsinline style="display: none;"></video>

        <button class="play-btn" id="ctrl-btn" onclick="togglePlayback()">▶</button>
        <div id="log">Статус: Очікування дії</div>
    </div>

    <script>
        // Ініціалізація Telegram Web App
        let tg = null;
        try {
            if (window.Telegram && window.Telegram.WebApp) {
                tg = window.Telegram.WebApp;
                tg.ready();
                tg.expand();
            }
        } catch (e) { console.log("Відкрито в звичайному браузері"); }

        // Перемкнулися на роботу з відео елементом
        const video = document.getElementById('radio-video');
        const btn = document.getElementById('ctrl-btn');
        const statusText = document.getElementById('status');
        const log = document.getElementById('log');

        function togglePlayback() {
            if (video.paused) {
                log.textContent = 'Завантаження відеопотоку...';
                video.play()
                    .then(() => {
                        btn.textContent = '⏸';
                        statusText.textContent = 'Зараз грає (Репіт відео)';
                        log.textContent = 'Успішно відтворюється!';
                    })
                    .catch((error) => {
                        log.textContent = 'Помилка: ' + error.message;
                    });
            } else {
                video.pause();
                btn.textContent = '▶';
                statusText.textContent = 'Пауза';
                log.textContent = 'Потік зупинено';
            }
        }
    </script>

</body>

</html>
