<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Radio: Audio + Image</title>
    <!-- ВИПРАВЛЕНО: Повне правильне посилання на скрипт Telegram Web App -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            background: #000; 
            color: #b0b0b0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .player-container {
            background: #000;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 20px 0px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border: 5px solid rgba(255, 255, 255, 0.18);
            width: 250px; /* Зафіксували ширину, щоб картка була охайною */
        }

        h3 { margin: 0 0 5px 0; font-size: 18px; }
        p { font-size: 14px; color: #b0b0b0; margin-bottom: 20px; }

        /* Стиль для статичної обкладинки */
        .live-cover {
            width: 100%;
            border-radius: 0px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .play-btn {
            background: #b0b0b0;
            color: #000;
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }
        
        /* ВИПРАВЛЕНО: Приємна та помітна анімація натискання (плавний клік) */
        .play-btn:active { 
            transform: scale(0.9); 
            background: #8e8e8e; 
        }
        
        /* Стиль для SVG-іконки всередині кнопки */
        .play-btn svg {
            width: 32px;
            height: 32px;
            fill: #000; 
            display: block;
        }

                /* Стиль для додаткових бічних кнопок */
                .side-btn {
            width: 45px !important;
            height: 45px !important;
            background: #4a4a4a !important;
        }
        .side-btn svg {
            width: 20px !important;
            height: 20px !important;
            fill: #b0b0b0 !important;
        }
        .side-btn:active {
            transform: scale(0.9) !important;
            background: #333333 !important;
        }


        #log { margin-top: 15px; font-size: 11px; color: #b0b0b0; padding: 0 10px; }
    </style>
</head>
<body>

    <div class="player-container">
        <h3>ⲢⲀⲆⲒⲞ ⳖⲈϜϜⲈRⲊⲞⲚ</h3>
        <p id="status">Натисніть Play для старту</p>

        <!-- ТЕКСТОВА ІНФОРМАЦІЯ ПРО ТРЕК -->
        <div style="margin: 15px 0; padding: 0 10px;">
            <div id="track-artist" style="font-size: 16px; font-weight: bold; color: #fff; margin-bottom: 4px;">Завантаження...</div>
            <div id="track-title" style="font-size: 14px; color: #b0b0b0;">...</div>
        </div>

        <!-- СТАТИЧНА ОБКЛАДИНКА -->
        <img id="track-cover" src="" alt="Cover" class="live-cover" style="width: auto; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); display: block;">

        <!-- ПРИХОВАНИЙ АУДІОТЕГ (Прибрано атрибут loop, щоб пісні могли перемикатися самі) -->
        <audio id="radio-audio" src="" preload="auto"></audio>
        
        <!-- БЛОК КЕРУВАННЯ З ТРЬОМА SVG-КНОПКАМИ -->
        <div style="display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 10px;">
            
            <!-- Кнопка Назад -->
            <button class="play-btn side-btn" onclick="prevTrack()">
                <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>

            <!-- Головна кнопка Play/Pause -->
            <button class="play-btn" id="ctrl-btn" onclick="togglePlayback()">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>
            </button>

            <!-- Кнопка Вперед -->
            <button class="play-btn side-btn" onclick="nextTrack()">
                <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6zm9-12v12h2V6z"/></svg>
            </button>
            
        </div>
        <div id="log">Статус: Очікування дії</div>
    </div>


    <script>
    let tg = null;
    try {
        if (window.Telegram && window.Telegram.WebApp) {
            tg = window.Telegram.WebApp;
            tg.ready();
            tg.expand();
        }
    } catch(e) { console.log("Відкрито в звичайному браузері"); }

    const audio = document.getElementById('radio-audio');
    const btn = document.getElementById('ctrl-btn');
    const statusText = document.getElementById('status');
    const log = document.getElementById('log');

    let playlist = [];
    let currentTrackIndex = 0;

    // Завантаження JSON з GitHub
    async function loadPlaylist() {
        try {
            log.textContent = 'Отримання списку треків...';
            const response = await fetch('https://jeff-set.github.io/radio/playlist.json');
            playlist = await response.json();
            
            if (playlist.length > 0) {
                // НОВЕ: При старті вибираємо РАНДОМНИЙ індекс треку
                currentTrackIndex = Math.floor(Math.random() * playlist.length);
                setupTrack(currentTrackIndex);
            }
        } catch (error) {
            console.error("Помилка завантаження плейлиста:", error);
            document.getElementById('track-artist').textContent = "Помилка мережі";
            log.textContent = "Не вдалося завантажити плейлист";
        }
    }

    // Підстановка даних поточного треку
    function setupTrack(index) {
        if (playlist.length === 0) return;
        
        const track = playlist[index];
        const wasPlaying = !audio.paused; // Запам'ятовуємо, чи грала музика до перемикання
        
        document.getElementById('track-artist').textContent = track.artist;
        document.getElementById('track-title').textContent = track.title + ` (${track.year})`;
        document.getElementById('track-cover').src = track.image_url; 
        audio.src = track.audio_url;
        
        log.textContent = 'Радіо готове до ефіру';

        // Якщо музика вже грала — автоматично запускаємо новий трек після перемикання
        if (wasPlaying) {
            audio.play().catch(e => console.log("Помилка автостарту:", e));
        }
    }

    // Керування Play/Pause
    function togglePlayback() {
        const svgPath = document.querySelector('#ctrl-btn svg path');

        if (audio.paused) {
            log.textContent = 'Підключення до ефіру...';
            audio.play()
                .then(() => {
                    svgPath.setAttribute('d', 'M6 19h4V5H6v14zm8-14v14h4V5h-4z');
                    statusText.textContent = 'Зараз грає 📻';
                    log.textContent = 'Ефір успішно запущено!';
                })
                .catch((error) => {
                    log.textContent = 'Помилка запуска: ' + error.message;
                });
        } else {
            audio.pause();
            svgPath.setAttribute('d', 'M8 5v14l11-7z');
            statusText.textContent = 'Пауза';
            log.textContent = 'Ефір зупинено';
        }
    }

    // НОВЕ: Функція для перемикання на ВИПАДКОВИЙ наступний трек
    function playRandomTrack() {
        if (playlist.length <= 1) return;
        
        let newIndex;
        // Цикл гарантує, що новий випадковий трек не буде збігатися з поточним
        do {
            newIndex = Math.floor(Math.random() * playlist.length);
        } while (newIndex === currentTrackIndex);
        
        currentTrackIndex = newIndex;
        setupTrack(currentTrackIndex);
    }

    // Кнопка Вперед (вмикає випадкову пісню)
    function nextTrack() {
        playRandomTrack();
    }

    // Кнопка Назад (вмикає випадкову пісню)
    function prevTrack() {
        playRandomTrack();
    }

    // НОВЕ: Коли пісня закінчується, автоматично вмикається НАСТУПНА РАНДОМНА
    audio.addEventListener('ended', () => {
        log.textContent = 'Перехід на наступний трек...';
        playRandomTrack();
    });

    loadPlaylist();

    </script>

</body>
</html>
