<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Radio: Audio + Video Hybrid</title>
    <!-- ВИПРАВЛЕНО: Правильне посилання на повний скрипт Telegram Web App -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            background: #000; 
            color: #b0b0b0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .player-container {
            background: #000;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 20px 0px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border: 5px solid rgba(255, 255, 255, 0.18);
            width: auto;
        }

        h3 { margin: 0 0 5px 0; font-size: 18px; }
        p { font-size: 14px; color: #b0b0b0; margin-bottom: 20px; }

        /* Стиль для відкритого відео (живої обкладинки) */
        .live-cover {
            width: 100%;
            border-radius: 0px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .play-btn {
            background: #b0b0b0;
            color: #000;
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }
        .play-btn:active { transform: scale(0.5); background: #000; }
        
        /* НОВЕ: Стиль для SVG-іконки всередині вашої круглої кнопки */
        .play-btn svg {
            width: 40px;
            height: 40px;
            fill: #000; /* Іконка буде чорною на сірому фоні кнопки */
            display: block;
        }

        #log { margin-top: 15px; font-size: 11px; color: #b0b0b0; }
    </style>
</head>
<body>

    <div class="player-container">
        <h3>ⲢⲀⲆⲒⲞ 📻 ⳖⲈϜϜⲈRⲊⲞⲚ</h3>
        <p id="status">Натисніть Play для старту</p>

        <!-- ТЕКСТОВА ІНФОРМАЦІЯ ПРО ТРЕК -->
        <div style="margin: 15px 0; padding: 0 10px;">
            <div id="track-artist" style="font-size: 16px; font-weight: bold; color: #fff; margin-bottom: 4px;">Завантаження...</div>
            <div id="track-title" style="font-size: 14px; color: #b0b0b0;">...</div>
        </div>

        <!-- НОВЕ: Звичайна статична обкладинка треку замість відео -->
        <img id="track-cover" src="" alt="Cover" class="live-cover" style="width: 100%; max-width: 220px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); display: block; margin-left: auto; margin-right: auto;">

        <!-- ПРИХОВАНИЙ АУДІОТЕГ: Тепер він відтворює ваш надлегкий AAC -->
        <audio id="radio-audio" src="" loop preload="auto"></audio>
        
        <br>
        <button class="play-btn" id="ctrl-btn" onclick="togglePlayback()">
            <svg viewBox="0 0 24 24">
                <path d="M8 5v14l11-7z"></path>
            </svg>
        </button>
        <div id="log">Статус: Очікування дії</div>
    </div>



    <script>
    // 1. Ініціалізація Telegram Web App
    let tg = null;
    try {
        if (window.Telegram && window.Telegram.WebApp) {
            tg = window.Telegram.WebApp;
            tg.ready();
            tg.expand();
        }
    } catch(e) { console.log("Відкрито в звичайному браузері"); }

    // 2. Отримуємо елементи
    const audio = document.getElementById('radio-audio');
    const btn = document.getElementById('ctrl-btn');
    const statusText = document.getElementById('status');
    const log = document.getElementById('log');

    let playlist = [];
    let currentTrackIndex = 0;

    // 3. Завантаження JSON з GitHub
    async function loadPlaylist() {
        try {
            log.textContent = 'Отримання списку треків...';
            const response = await fetch('https://github.io');
            playlist = await response.json();
            
            setupTrack(currentTrackIndex);
        } catch (error) {
            console.error("Помилка завантаження плейлиста:", error);
            document.getElementById('track-artist').textContent = "Помилка мережі";
            log.textContent = "Не вдалося завантажити плейлист";
        }
    }

    // 4. Підстановка даних поточного треку
    function setupTrack(index) {
        if (playlist.length === 0) return;
        
        const track = playlist[index];
        
        // Виводимо тексти
        document.getElementById('track-artist').textContent = track.artist;
        document.getElementById('track-title').textContent = track.title + ` (${track.year})`;
        
        // Автоматично підставляємо посилання на картинку обкладинки та AAC звук
        document.getElementById('track-cover').src = track.image_url; // Перевірте, щоб у JSON цей ключ називався саме image_url або змініть тут
        audio.src = track.audio_url;
        
        log.textContent = 'Радіо готове до ефіру';
    }

    // 5. Просте та надійне керування Play/Pause
    function togglePlayback() {
        const svgPath = document.querySelector('#ctrl-btn svg path');

        if (audio.paused) {
            log.textContent = 'Підключення до ефіру...';
            
            audio.play()
                .then(() => {
                    // Зміна іконки на паузу
                    svgPath.setAttribute('d', 'M6 19h4V5H6v14zm8-14v14h4V5h-4z');
                    statusText.textContent = 'Зараз грає 📻';
                    log.textContent = 'Ефір успішно запущено!';
                })
                .catch((error) => {
                    log.textContent = 'Помилка запуска: ' + error.message;
                });
        } else {
            audio.pause();
            // Зміна іконки на Play
            svgPath.setAttribute('d', 'M8 5v14l11-7z');
            statusText.textContent = 'Пауза';
            log.textContent = 'Ефір зупинено';
        }
    }

    // Запуск системи
    loadPlaylist();

    </script>


</body>
</html>
