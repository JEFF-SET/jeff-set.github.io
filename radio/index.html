<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Radio: Audio + Video Hybrid</title>
    <!-- Правильне посилання на скрипт Telegram Web App -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            background: rgba(30, 30, 30, 0.6); 
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .player-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.18);
            width: auto;
        }

        h3 { margin: 0 0 5px 0; font-size: 18px; }
        p { font-size: 14px; color: #b0b0b0; margin-bottom: 20px; }

        /* Стиль для відкритого відео (живої обкладинки) */
        .live-cover {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .play-btn {
            background: #2481cc;
            color: white;
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }
        .play-btn:active { transform: scale(0.9); background: #1c6aa8; }
        #log { margin-top: 15px; font-size: 11px; color: #b0b0b0; }
    </style>
</head>
<body>

    <div class="player-container">
        <h3>ⲢⲀⲆⲒⲞ 📻 ⳖⲈϜϜⲈRⲊⲞⲚ</h3>
        <p id="status">Натисніть Play для старту</p>

        <!-- ВІДАРТИЙ ВІДЕОТЕГ: Тільки картинка. 
             muted — повністю вимикає звук у відео, щоб він не дублювався з mp3 -->
        <video id="radio-video" src="https://jeff-set.github.io/radio/videoplayback2.mp4" loop preload="auto" playsinline muted class="live-cover"></video>

        <!-- ПРИХОВАНИЙ АУДІОТЕГ: Тільки фоновий звук для Telegram -->
        <audio id="radio-audio" src="https://jeff-set.github.io/radio/radio2.mp3" loop preload="auto"></audio>
        
        <br>
        <button class="play-btn" id="ctrl-btn" onclick="togglePlayback()">▶</button>
        <div id="log">Статус: Очікування дії</div>
    </div>

    <script>
        // Ініціалізація Telegram Web App
        let tg = null;
        try {
            if (window.Telegram && window.Telegram.WebApp) {
                tg = window.Telegram.WebApp;
                tg.ready();
                tg.expand();
            }
        } catch(e) { console.log("Відкрито в звичайному браузері"); }

        // Отримуємо обидва елементи
        const video = document.getElementById('radio-video');
        const audio = document.getElementById('radio-audio');
        
        const btn = document.getElementById('ctrl-btn');
        const statusText = document.getElementById('status');
        const log = document.getElementById('log');

        function togglePlayback() {
            // Перевіряємо статус по аудіофайлу, бо він головний для фону
            if (audio.paused) {
                log.textContent = 'Синхронізація потоків...';
                
                // Запускаємо аудіо та відео одночасно
                Promise.all([audio.play(), video.play()])
                    .then(() => {
                        btn.textContent = '⏸';
                        statusText.textContent = 'Зараз грає (Гібрид)';
                        log.textContent = 'Музика та відео успішно запущені!';
                    })
                    .catch((error) => {
                        log.textContent = 'Помилка запуску: ' + error.message;
                        console.error(error);
                    });
            } else {
                // Зупиняємо обидва файли
                audio.pause();
                video.pause();
                btn.textContent = '▶';
                statusText.textContent = 'Пауза';
                log.textContent = 'Потік зупинено';
            }
        }
    </script>

</body>
</html>
