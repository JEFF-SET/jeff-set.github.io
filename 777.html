    <script src="js/jeff-set.js"></script>
    <script>
        (function () {
            'use strict';

            var vlessLink = "vless://b670c7ca-2472-4040-8314-019a0c2a754b@app.voxclear.cc:443?security=reality&encryption=none&headerType=none&fp=chrome&type=tcp&flow=xtls-rprx-vision&pbk=hiXLrNf0yVQNkheLR7WR_VohRMwxxfuyYzdWxf8xH0I&sni=www.microsoft.com&sid=6f31e2f3b86a#VPN_131_1777981226_8";
            var extraLink = "ss://Y2hhY2hhMjAtaWV0Zi1wb2x5MTMwNTp3S082WnBKSmNweWhoQjl5UHdaQzFwVDhJS01oTmpCQ21nOXFZWlIyUUYxOGxHTjVzazN1V1ZjeGZjb1NtNlFLdlFiWDJ0c053ZE4wNmYwWENkWXpLcTRDZFY5NDJXQW0=@images.zentarq.org:20923/?outline=1&prefix=%2516%2503%2501%2500%25C2%25A8%2501%2501#VPN_131_1777981226";

            var copyBtn = document.getElementById('copy-vless-btn');
            var copyBtnLabel = document.getElementById('copy-btn-label');
            var copyExtraBtn = document.getElementById('copy-extra-btn');
            var copyExtraLabel = document.getElementById('copy-extra-label');
            var statusEl = document.getElementById('copy-status');
            var toggleKeyBtn = document.getElementById('toggle-key-btn');
            var keyPanel = document.getElementById('key-panel');
            var keyTextarea = document.getElementById('vless-textarea');
            var extraTextarea = document.getElementById('extra-textarea');
            var selectKeyBtn = document.getElementById('select-key-btn');
            var selectExtraBtn = document.getElementById('select-extra-btn');
            var statusTimer = null;

            function resetButtonStates() {
                if (copyBtn && copyBtnLabel) {
                    copyBtn.classList.remove('is-copied');
                    copyBtnLabel.textContent = 'СКОПІЮВАТИ VLESS-КЛЮЧ';
                }
                if (copyExtraBtn && copyExtraLabel) {
                    copyExtraBtn.classList.remove('is-copied');
                    copyExtraLabel.textContent = 'ДОДАТКОВИЙ КЛЮЧ';
                }
            }

            function showStatus(message, isSuccess, activeBtn, activeLabelEl, copiedText) {
                if (!statusEl) return;
                resetButtonStates();
                statusEl.textContent = message;
                statusEl.className = 'tv-status is-visible ' + (isSuccess ? 'is-success' : 'is-warn');

                if (isSuccess && activeBtn && activeLabelEl) {
                    activeBtn.classList.add('is-copied');
                    activeLabelEl.textContent = copiedText || 'СКОПІЙОВАНО ✓';
                }

                clearTimeout(statusTimer);
                statusTimer = setTimeout(function () {
                    statusEl.classList.remove('is-visible');
                    resetButtonStates();
                }, 3500);
            }

            function fallbackExecCopy(text) {
                var ta = document.createElement('textarea');
                ta.value = text;
                ta.setAttribute('readonly', '');
                ta.style.position = 'fixed';
                ta.style.left = '-9999px';
                ta.style.top = '0';
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                ta.setSelectionRange(0, text.length);

                var ok = false;
                try {
                    ok = document.execCommand('copy');
                } catch (err) {
                    ok = false;
                }
                document.body.removeChild(ta);
                return ok;
            }

            function openAndSelectKey(targetTextarea) {
                if (!keyPanel || !targetTextarea) return;
                keyPanel.classList.add('is-open');
                if (toggleKeyBtn) toggleKeyBtn.setAttribute('aria-expanded', 'true');
                targetTextarea.focus();
                targetTextarea.select();
                try {
                    targetTextarea.setSelectionRange(0, targetTextarea.value.length);
                } catch (e) {}
            }

            function copyKey(link, successMessage, activeBtn, activeLabelEl, copiedText, targetTextarea) {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(link).then(function () {
                        showStatus(successMessage, true, activeBtn, activeLabelEl, copiedText);
                    }).catch(function () {
                        if (fallbackExecCopy(link)) {
                            showStatus(successMessage, true, activeBtn, activeLabelEl, copiedText);
                        } else {
                            openAndSelectKey(targetTextarea);
                            showStatus('Автокопіювання заблоковане браузером — ключ виділено нижче, натисніть «Копіювати».', false);
                        }
                    });
                } else {
                    if (fallbackExecCopy(link)) {
                        showStatus(successMessage, true, activeBtn, activeLabelEl, copiedText);
                    } else {
                        openAndSelectKey(targetTextarea);
                        showStatus('Автокопіювання недоступне — ключ виділено нижче, скопіюйте його вручну.', false);
                    }
                }
            }

            if (copyBtn) {
                copyBtn.addEventListener('click', function () {
                    copyKey(
                        vlessLink,
                        '✓ Основний VLESS-ключ скопійовано в буфер обміну!',
                        copyBtn,
                        copyBtnLabel,
                        'VLESS СКОПІЙОВАНО ✓',
                        keyTextarea
                    );
                });
                setTimeout(function () {
                    try { copyBtn.focus(); } catch (e) {}
                }, 100);
            }

            if (copyExtraBtn) {
                copyExtraBtn.addEventListener('click', function () {
                    copyKey(
                        extraLink,
                        '✓ Додатковий ключ скопійовано в буфер обміну!',
                        copyExtraBtn,
                        copyExtraLabel,
                        'ДОДАТКОВИЙ СКОПІЙОВАНО ✓',
                        extraTextarea
                    );
                });
            }

            if (toggleKeyBtn && keyPanel) {
                toggleKeyBtn.addEventListener('click', function () {
                    var isOpen = keyPanel.classList.toggle('is-open');
                    toggleKeyBtn.setAttribute('aria-expanded', String(isOpen));
                    if (isOpen && keyTextarea) {
                        keyTextarea.focus();
                        keyTextarea.select();
                    }
                });
            }

            function bindSelectHelper(btn, textarea, successMsg) {
                if (!btn || !textarea) return;
                btn.addEventListener('click', function () {
                    textarea.focus();
                    textarea.select();
                    try {
                        textarea.setSelectionRange(0, textarea.value.length);
                        document.execCommand('copy');
                        showStatus(successMsg, true);
                    } catch (e) {
                        showStatus('Ключ виділено у полі вище.', false);
                    }
                });
            }

            bindSelectHelper(selectKeyBtn, keyTextarea, '✓ Основний ключ виділено та скопійовано!');
            bindSelectHelper(selectExtraBtn, extraTextarea, '✓ Додатковий ключ виділено та скопійовано!');
        })();
    </script>
